<script>
"use strict";
const $ = id => document.getElementById(id);
const A = $("audio");
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };
const MODES = [["all","循環：全部"],["vol","循環：本卷"],["one","循環：單曲"]];
let T = [], VOLS = [], idx = 0, mode = store.get("bc-mode") || "all", tab = 0, slide = -1, layer = 0, wide = matchMedia("(min-width:901px)");
const fmt = s => isFinite(s) ? Math.floor(s/60) + ":" + String(Math.floor(s%60)).padStart(2,"0") : "0:00";
const pretty = f => f.replace(/\.mp3$/,"").replace(/_s_/g,"'s ").replace(/’/g,"'").replace(/_/g," ");
const cgURL = (t, k) => t.cgu[k][wide.matches ? 0 : 1];   // [原圖, 手機用 720 寬的縮圖]；完整網址在 tracks.json（jsDelivr 每張卡一個 tag，作者 2026-10-07）

fetch("tracks.json").then(r => r.json()).then(data => {
  T = data;
  T.forEach((t,i) => { t.i = i; let v = VOLS.find(v => v.vol === t.vol); if (!v) VOLS.push(v = { vol:t.vol, name:t.volName, tracks:[] }); v.tracks.push(t); });
  $("tabs").innerHTML = VOLS.map((v,i) => `<button data-i="${i}">${v.vol.replace("第","").replace("卷","")}</button>`).join("");
  $("tabs").onclick = e => { const b = e.target.closest("button"); if (b) showTab(+b.dataset.i); };
  const last = +(store.get("bc-idx") || 0);
  load(T[last] ? last : 0, false);
  const pos = +(store.get("bc-pos") || 0); if (pos) A.addEventListener("loadedmetadata", () => { A.currentTime = pos; }, { once:true });
  setMode(mode);
});

function showTab(i){
  tab = i; const v = VOLS[i];
  [...$("tabs").children].forEach((b,k) => b.classList.toggle("on", k === i));
  $("volhead").querySelector("b").textContent = `${v.vol}〈${v.name}〉`;
  $("volhead").querySelector("span").textContent = `${v.tracks.length} 首 · ${fmt(v.tracks.reduce((s,t) => s + t.dur, 0))}`;
  $("list").innerHTML = v.tracks.map(t => `<li data-i="${t.i}" class="${t.i === idx ? "on" : ""}"><img loading="lazy" src="${t.cover}" alt=""><div class="t"><b>${t.act}　${pretty(t.file)}</b><span>${t.line}</span></div><span class="d">${fmt(t.dur)}</span><button class="dl" data-f="${t.i}" aria-label="下載 ${pretty(t.file)}" title="下載"><svg viewBox="0 0 24 24"><path d="M11 4h2v9l3.5-3.5 1.4 1.4L12 16.8 6.1 10.9l1.4-1.4L11 13zM5 18h14v2H5z"/></svg></button></li>`).join("");
}
$("list").onclick = e => { const d = e.target.closest(".dl"); if (d) { e.stopPropagation(); download(+d.dataset.f, d); return; } const li = e.target.closest("li"); if (li) { load(+li.dataset.i, true); } };
// 下載：音檔在 jsDelivr（別的網域），<a download> 會被忽略，先 fetch 成 blob 再存；失敗就開原檔（作者 2026-10-05：每首都要能下載）
function download(i, btn){
  const t = T[i], url = t.src, old = btn.innerHTML;
  btn.disabled = true; if (btn.id === "dlbtn") btn.textContent = "下載中…";
  fetch(url).then(r => { if (!r.ok) throw 0; return r.blob(); }).then(b => {
    const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = t.file.replace(/’/g, "'");
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 3000);
  }).catch(() => window.open(url, "_blank")).then(() => { btn.disabled = false; btn.innerHTML = old; });
}
$("dlbtn").onclick = () => download(idx, $("dlbtn"));
$("playvol").onclick = () => { setMode(mode === "one" ? "vol" : mode); load(VOLS[tab].tracks[0].i, true); };
$("playall").onclick = () => { setMode("all"); load(0, true); };

function load(i, autoplay){
  idx = i; const t = T[i]; store.set("bc-idx", i); store.set("bc-pos", 0);
  A.src = t.src;
  $("cover").src = t.cover; $("vol").textContent = `${t.vol}〈${t.volName}〉　${t.act}`;
  $("title").textContent = pretty(t.file); $("line").textContent = t.line;
  $("dur").textContent = fmt(t.dur); $("cur").textContent = "0:00"; $("seek").value = 0;   // 還沒載入前先顯示曲目表裡的長度
  document.title = `${pretty(t.file)} · 香布纏原聲帶`;
  slide = -1; showSlide(0);
  const vi = VOLS.findIndex(v => v.vol === t.vol); showTab(vi);
  const li = $("list").querySelector(`li[data-i="${i}"]`); if (li) li.scrollIntoView({ block:"nearest" });
  if ("mediaSession" in navigator) navigator.mediaSession.metadata = new MediaMetadata({
    title: pretty(t.file), artist: "仙泉．香布纏 原聲帶", album: `${t.vol}〈${t.volName}〉${t.act}`,
    artwork: [{ src: new URL(t.cover, location.href).href, sizes: "640x640", type: "image/webp" }] });
  if (autoplay) play();
}
function play(){ initViz(); A.play().then(() => { $("hint").hidden = true; }).catch(() => { $("hint").hidden = false; }); }
$("hint").onclick = () => play();
$("play").onclick = () => A.paused ? play() : A.pause();
A.onplay = () => { $("playicon").setAttribute("d","M6 5h4v14H6zm8 0h4v14h-4z"); $("play").setAttribute("aria-label","暫停"); };
A.onpause = () => { $("playicon").setAttribute("d","M8 5v14l11-7z"); $("play").setAttribute("aria-label","播放"); };
function neighbor(step){
  const t = T[idx];
  if (mode === "vol") { const v = VOLS.find(v => v.vol === t.vol).tracks, k = v.indexOf(t); return v[(k + step + v.length) % v.length].i; }
  return (idx + step + T.length) % T.length;
}
$("prev").onclick = () => { if (A.currentTime > 3) A.currentTime = 0; else load(neighbor(-1), true); };
$("next").onclick = () => load(neighbor(1), true);
A.onended = () => { if (mode === "one") { A.currentTime = 0; play(); } else if (mode === "all" && idx === T.length - 1) { load(0, false); } else load(neighbor(1), true); };
function setMode(m){ mode = m; store.set("bc-mode", m); $("mode").textContent = MODES.find(x => x[0] === m)[1]; A.loop = false; }
const narrow = matchMedia("(max-width:900px)");
document.body.classList.toggle("nolist", narrow.matches || store.get("bc-list") === "0");
$("listbtn").onclick = () => { const off = document.body.classList.toggle("nolist"); if (!narrow.matches) store.set("bc-list", off ? "0" : "1"); };
$("list").addEventListener("click", () => { if (narrow.matches) setTimeout(() => document.body.classList.add("nolist"), 300); });
$("grab").onclick = e => { e.stopPropagation(); document.body.classList.add("nolist"); };
// 手機上曲目清單打開時，點清單外面任何地方就收回去（作者 2026-10-05）
document.addEventListener("click", e => {
  if (!narrow.matches || document.body.classList.contains("nolist")) return;
  if (e.target.closest("#side") || e.target.closest("#listbtn")) return;
  document.body.classList.add("nolist");
});
// 隱藏介面：只剩 CG 與音樂；點畫面任何地方、按 H 或 Esc 叫回來（作者 2026-10-05）
function bare(on){
  document.body.classList.toggle("bare", on);
  const tip = $("baretip"); tip.classList.toggle("show", on); clearTimeout(bare.t);
  if (on) bare.t = setTimeout(() => tip.classList.remove("show"), 2500);
}
$("barebtn").onclick = e => { e.stopPropagation(); bare(true); };
document.addEventListener("click", e => { if (document.body.classList.contains("bare")) { e.preventDefault(); e.stopPropagation(); bare(false); } }, true);
document.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("input")) return;
  if (e.key === "h" || e.key === "H") bare(!document.body.classList.contains("bare"));
  else if (e.key === "Escape") bare(false);
});
$("mode").onclick = () => setMode(MODES[(MODES.findIndex(x => x[0] === mode) + 1) % MODES.length][0]);
let seeking = false;
$("seek").oninput = () => { seeking = true; $("cur").textContent = fmt($("seek").value / 1000 * A.duration); };
$("seek").onchange = () => { A.currentTime = $("seek").value / 1000 * A.duration; seeking = false; };
A.ontimeupdate = () => {
  if (!seeking && A.duration) $("seek").value = A.currentTime / A.duration * 1000;
  $("cur").textContent = fmt(A.currentTime); $("dur").textContent = fmt(A.duration || T[idx].dur);
  if (Math.floor(A.currentTime) % 5 === 0) store.set("bc-pos", A.currentTime);
  const n = T[idx].cgs.length; if (n && A.duration) showSlide(Math.min(n - 1, Math.floor(A.currentTime / A.duration * n)));
};

// 背景：這首曲子底下那幾張 CG，依時間平均分配，照劇情順序換；沒有 CG 的曲子就用封面
function showSlide(k){
  if (k === slide) return; slide = k;
  const t = T[idx], src = t.cgs.length ? cgURL(t, k) : t.cover;
  const next = $("s" + (1 - layer)), cur = $("s" + layer);
  // 慢慢平移、放大，時間就是這張圖要停的長度；方向每張隨機，一張圖停一整首也不會定格（作者 2026-10-05）
  const hold = t.cgs.length ? t.dur / t.cgs.length : t.dur, r = () => (Math.random() * 6 - 3).toFixed(2) + "%";
  next.onload = () => {
    next.classList.remove("on"); void next.offsetWidth;
    next.style.setProperty("--kb", Math.max(8, hold + 2) + "s");
    for (const v of ["--x0","--y0","--x1","--y1"]) next.style.setProperty(v, r());
    next.classList.add("on"); cur.classList.remove("on"); layer = 1 - layer;
  };
  next.src = src;
  if (t.cgs[k + 1]) { const im = new Image(); im.crossOrigin = "anonymous"; im.src = cgURL(t, k + 1); }   // 先載下一張；帶 CORS，SW 才存得到（不帶是 opaque，存不進去也佔配額）
}

// 律動：桌機接真的頻譜；手機不接 Web Audio（Android 關螢幕會讓 AudioContext 斷音），畫模擬的
const cv = $("viz"), g = cv.getContext("2d"); let an = null, buf = null, ctxA = null;
const mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.platform));
function initViz(){
  if (mobile || ctxA) return;
  try { ctxA = new (window.AudioContext || window.webkitAudioContext)(); const s = ctxA.createMediaElementSource(A); an = ctxA.createAnalyser(); an.fftSize = 256; an.smoothingTimeConstant = .82; s.connect(an); an.connect(ctxA.destination); buf = new Uint8Array(an.frequencyBinCount); } catch(e) { an = null; }
  if (ctxA && ctxA.state === "suspended") ctxA.resume();
}
function draw(ts){
  requestAnimationFrame(draw);
  const w = cv.width = cv.clientWidth * devicePixelRatio, h = cv.height = cv.clientHeight * devicePixelRatio, N = 64;
  g.clearRect(0,0,w,h);
  if (an) an.getByteFrequencyData(buf);
  const grad = g.createLinearGradient(0,h,0,0); grad.addColorStop(0,"rgba(160,32,42,.85)"); grad.addColorStop(.6,"rgba(202,168,95,.55)"); grad.addColorStop(1,"rgba(226,193,124,0)");
  g.fillStyle = grad; const bw = w / N;
  for (let i = 0; i < N; i++) {
    let v;
    if (an) v = buf[Math.floor(i * buf.length * .72 / N)] / 255;
    else v = A.paused ? .03 : (.18 + .5 * Math.abs(Math.sin(ts/900 + i*.37) * Math.cos(ts/1300 + i*.21))) * (1 - i/N*.5);
    const bh = Math.max(2, v * h), x = i * bw;
    g.fillRect(x + bw*.18, h - bh, bw*.64, bh);
  }
}
requestAnimationFrame(draw);

if ("mediaSession" in navigator) {
  navigator.mediaSession.setActionHandler("play", play);
  navigator.mediaSession.setActionHandler("pause", () => A.pause());
  navigator.mediaSession.setActionHandler("previoustrack", () => load(neighbor(-1), true));
  navigator.mediaSession.setActionHandler("nexttrack", () => load(neighbor(1), true));
  try { navigator.mediaSession.setActionHandler("seekto", e => { A.currentTime = e.seekTime; }); } catch(e) {}
}
document.addEventListener("keydown", e => { if (e.code === "Space" && e.target === document.body) { e.preventDefault(); $("play").click(); } });

if ("serviceWorker" in navigator) {
  const had = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js").catch(() => {});
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (had && A.paused) location.reload(); });
}
</script>
